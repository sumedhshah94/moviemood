[tool.poetry]
name = "MovieMood"
version = "0.1.0"
description = "W210 project"
authors = [
    "Neil Prabhu <neilp@juniper.net>", 
    "Neta Tartakovsky <ntartakovsky@ischool.berkeley.edu>",
    "Josefina Ruggieri <jruggieri@ischool.berkeley.edu>",
    "Sumedh Shah <sumedh.shah@ischool.berkeley.edu>",
    "Will Dudek <wdudek@ischool.berkeley.edu>"
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.1.1"
requests = "^2.31.0"
fastapi = "^0.103.1"
uvicorn = "^0.23.2"
enchant = "^0.0.1"
pyenchant = "^3.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
black = "^23.9.1"
isort = "^5.12.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
